   <g id="text_1">
    <text style="font-weight: 700; font-size: 14px; font-family: 'Microsoft YaHei'; text-anchor: start; fill: #147d78" x="74.4336" y="165.745212" transform="rotate(-0 74.4336 165.745212)">01 明确问题</text>
   </g>
   <g id="text_2">
    <text style="font-size: 11px; font-family: 'Microsoft YaHei'; fill: #192f3d" transform="translate(74.4336 200.406021)">行业范围 · 资料时点</text>
    <text style="font-size: 11px; font-family: 'Microsoft YaHei'; fill: #192f3d" transform="translate(74.4336 219.733257)">交付：研究任务卡</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 14px; font-family: 'Microsoft YaHei'; text-anchor: start; fill: #147d78" x="339.7248" y="165.718962" transform="rotate(-0 339.7248 165.718962)">02 查找资料</text>
   </g>
   <g id="text_4">
