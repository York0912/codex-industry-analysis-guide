   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 14px; font-family: 'Microsoft YaHei'; text-anchor: start; fill: #147d78" x="74.4336" y="328.712562" transform="rotate(-0 74.4336 328.712562)">06 审查与更新</text>
   </g>
   <g id="text_8">
    <text style="font-size: 11px; font-family: 'Microsoft YaHei'; fill: #192f3d" transform="translate(74.4336 363.389308)">反方证据 · 新增信息</text>
    <text style="font-size: 11px; font-family: 'Microsoft YaHei'; fill: #192f3d" transform="translate(74.4336 382.768966)">交付：跟踪记录</text>
   </g>
   <g id="text_9">
